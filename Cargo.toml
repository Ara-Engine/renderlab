[package]
name = "renderlab"
version = "0.1.2"
edition = "2024"
publish = false

[features]
backend-ara = ["dep:ara-gpu", "dep:anyhow", "dep:half", "dep:bytemuck", "dep:serde_json", "naga/msl-out", "naga/spv-out", "wgpu/vulkan-portability"]
selection-oracle = ["renderlab-asset/selection-oracle"]
selection-shadow = ["selection-oracle"]
selection-profile = ["renderlab-asset/selection-profile"]

[workspace]
resolver = "3"
members = ["viewer", "crates/asset", "crates/cook"]

[dependencies]
# Temporary pin until Ara PR #5 merges; disabled in default wgpu builds.
ara-gpu = { git = "https://github.com/Ara-Engine/ara", rev = "8240cb06761dcc1a0e0842ce8279337c2e3ee8f9", optional = true }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
half = { version = "2.7", optional = true }
bytemuck = { version = "1.24", optional = true }
renderlab-asset = { path = "crates/asset" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl", "counters"] }
pollster = "0.4"
glam = "0.30.10"
sha2 = "=0.10.9"
# Shared work-stealing pool and allocation-free parallel sorts for runtime mesh preparation.
rayon = "1.11"
# Program composition checks and Parameters reflection; wgpu already validates with it.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
# Matches wgpu-hal's existing Vulkan binding; no second Vulkan loader/backend.
ash = { version = "=0.38.0", default-features = false, features = ["std", "debug"] }

[dev-dependencies]
renderlab-cook = { path = "crates/cook" }
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
png = "0.18"

# Measurement adapters only: the same process-local DXGI budget counter as Unreal.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi"] }

[profile.dev]
debug = "line-tables-only"
incremental = true

# Keep large-scene upload preparation practical while viewer edits stay opt-0.
[profile.dev.package.renderlab]
opt-level = 1

[profile.dev.package.renderlab-asset]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

# The editable shader frontend is runtime work in the development viewer.
[profile.dev.package.naga]
opt-level = 2
