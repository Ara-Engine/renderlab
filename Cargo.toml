[package]
name = "renderlab"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"
members = ["viewer", "crates/asset", "crates/cook"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl", "counters"] }
pollster = "0.4"
glam = "0.30.10"

[dev-dependencies]
log = "0.4"

[profile.dev]
debug = "line-tables-only"
incremental = true

