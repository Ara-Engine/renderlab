[package]
name = "renderlab-cook"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
renderlab-asset = { path = "../asset" }
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
serde_json = "=1.0.149"
meshopt = "=0.7.0"
mikktspace = { version = "=0.3.0", default-features = false, features = ["glam"] }
